<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Z Tabs</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="header">
      <span class="lockup">
        <svg class="mark" width="26" height="26" viewBox="0 0 48 48" role="img" aria-label="Z">
          <rect x="10" y="4" width="34" height="30" rx="8" fill="#4D94FF" fill-opacity="0.45"/>
          <rect x="4" y="12" width="34" height="32" rx="9" fill="#0068FF"/>
          <path d="M13 21h16L13 36h16" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="wordmark">Tabs</span>
      </span>
      <span class="badge-slot"><span id="badge" class="badge" hidden></span></span>
      <button id="auto" class="icon-btn" type="button" aria-pressed="true" aria-label="Auto-reload tabs" title="Auto-reload tabs">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
    </header>

    <section class="center">
      <button id="toggle" class="switch" type="button" role="switch" aria-checked="false" aria-label="Multi-tab mode">
        <span class="knob">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10L7 17h10"/></svg>
        </span>
      </button>
    </section>

    <footer class="footer">
      <span id="credit" class="credit">Crafted by&nbsp;<a id="creditLink" href="https://github.com/nh4ttruong">@nh4ttruong</a></span>
      <span id="toast" class="pill pill-ok" role="status" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        New Zalo tab opened
      </span>
      <button id="pending" class="pill pill-action" type="button" hidden></button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
